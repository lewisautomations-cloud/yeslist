<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YesList at Xavier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
<style>
/* VOICE: plain and direct, like a list someone marked up for you.
   IDEA: a highlighter. The alumni who said yes are the names marked in yellow.
   PICTURE: the working app on white paper, each alum's name under a yellow marker stroke.
   COLOUR and TYPE: black ink, white paper, highlighter yellow; Source Serif 4 for headings and names, Instrument Sans for the rest.
   LAYOUT: one phone-width column; on a laptop it sits centred on the same paper. */
:root{color-scheme:light dark;
  --bg:light-dark(#FAFAF7,#121212);--panel:light-dark(#FFFFFF,#1C1C1C);
  --ink:light-dark(#141414,#F2F2EE);--soft:light-dark(#3A3A3A,#D6D6D0);--muted:light-dark(#555555,#A8A8A2);
  --line:light-dark(#E2E2DC,#2F2F2C);--tint:light-dark(#FFF6BD,#3A3721);--hero:light-dark(#F3F2EC,#181816);
  --sky:light-dark(#141414,#FBE45B);--btn:light-dark(#141414,#FBE45B);--onbtn:light-dark(#FFFFFF,#141414);
  --btnhover:light-dark(#3A3A3A,#FDEB85);--plain:light-dark(#EFEFEA,#2A2A28);
  --mark:light-dark(#FBE45B,rgba(251,228,91,.32));--band:var(--bg);
  --solid:light-dark(#141414,#F2F2EE);--onsolid:light-dark(#FFFFFF,#141414);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif}
.mk{background:linear-gradient(transparent 56%,var(--mark) 56%,var(--mark) 94%,transparent 94%);padding:0 3px;margin:0 -3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.col{max-width:480px;margin:0 auto;padding:0 18px}
header{background:var(--band);color:var(--ink);padding:12px 0 20px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:17px;font-family:var(--serif)}
.brand svg{width:22px;height:22px;flex:none;color:var(--ink)}.brand .school{font-weight:400;color:var(--muted);margin-left:-1px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink);padding:10px 8px 10px 0;min-height:44px;font-weight:600}
.back svg{width:18px;height:18px}
h1{font-family:var(--serif);font-size:clamp(30px,8.5vw,38px);line-height:1.08;font-weight:600;letter-spacing:-.01em;margin:14px 0 6px;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:16px;max-width:38ch}
main{padding:18px 0 40px}
.undecided{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--tint);border:1.5px solid var(--sky);border-radius:14px;padding:14px 16px;min-height:60px;margin-bottom:18px}
.undecided b{display:block;font-size:17px}.undecided span{color:var(--muted);font-size:14px}
.letter{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 6px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px;min-height:52px;font-size:16px}
.row:first-child{border-top:0}
.row:active{background:var(--tint)}
.chev{width:16px;height:16px;flex:none;color:var(--muted)}
.areas{display:grid;gap:10px}
.area{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:60px}
.area[aria-pressed=true]{border-color:var(--sky);background:var(--tint)}
.area b{display:block;font-size:17px;margin-bottom:2px}.area span{color:var(--muted);font-size:14px;line-height:1.4}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.area[aria-pressed=true] .box{background:var(--sky);border-color:var(--sky)}
.box svg{width:14px;height:14px;color:var(--onbtn);opacity:0}.area[aria-pressed=true] .box svg{opacity:1}
.dock{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:22px 0 16px;margin-top:6px}
.dock small{display:block;text-align:center;color:var(--muted);margin-top:8px;font-size:14px}
.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:700;font-size:17px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.key{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.key div{display:grid;grid-template-columns:116px minmax(0,1fr);gap:10px;align-items:start}
.demo{font-size:13px;color:var(--muted);margin:10px 4px 14px}
.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:14px;margin:2px 0 8px}
.job{margin:0;font-size:15px}
.city{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:14px;margin:2px 0 10px}
.city svg{width:14px;height:14px;flex:none}
.note{margin:0 0 12px;font-family:var(--serif);font-size:16px;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;border:1.5px solid transparent;white-space:nowrap;justify-self:start}
.t-advice{border-color:var(--sky);color:var(--ink)}
.t-project{background:var(--plain);color:var(--ink)}
.t-intern{background:var(--solid);color:var(--onsolid)}
.req{min-height:46px;font-size:16px}
.who{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
.who h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0}.who p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.who .tags{margin:0}
label,.lbl{display:block;font-weight:700;font-size:16px;margin:0 0 6px}
.hint{display:block;font-weight:400;color:var(--muted);font-size:14px}
.field{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600}
.chip[aria-checked=true]{background:var(--solid);color:var(--onsolid);border-color:var(--solid)}
input[type=text],textarea{width:100%;font-size:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input[type=text]:focus,textarea:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px var(--tint)}
textarea{min-height:150px;resize:vertical;line-height:1.45}
.count{text-align:right;font-size:13px;color:var(--muted);margin-top:4px}
.ctx{font-size:14px;color:var(--muted);margin:0 0 16px}
.done{display:grid;justify-items:center;text-align:center;padding:8px 0 4px}
.done svg{width:76px;height:76px}
.ring{stroke:var(--sky)}.tick{stroke:var(--sky);stroke-dasharray:60;stroke-dashoffset:0;animation:draw .5s ease-out .1s both}
@keyframes draw{from{stroke-dashoffset:60}}
@media (prefers-reduced-motion:reduce){.tick{animation:none}}
.copy{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0 10px}
.copy dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px}
.copy dt{color:var(--muted)}.copy dd{margin:0}
.copy .q{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.stack{display:grid;gap:10px;margin-top:18px}
.sec{font-family:var(--serif);font-weight:600;font-size:20px;margin:26px 4px 4px;line-height:1.25}
.secp{margin:0 4px 12px;color:var(--muted);font-size:14px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.searchbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0;margin:-18px 0 6px}
.sbox{position:relative}
.sbox input{width:100%;min-height:50px;padding:12px 46px 12px 44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:16px;-webkit-appearance:none;appearance:none}
.sbox input:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px var(--tint)}
input[type=search]::-webkit-search-cancel-button{display:none}
.sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.clear{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:10px}
.clear svg{width:16px;height:16px}.clear[hidden]{display:none}
.rcount{font-size:14px;color:var(--muted);margin:4px 4px 0}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.upl svg{width:18px;height:18px}
.upl:has(+ input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.file{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--sky);border-radius:12px;padding:8px 6px 8px 14px}
.file>div{flex:1}.file b{display:block;font-size:15px;overflow-wrap:anywhere}.file span{font-size:13px;color:var(--muted)}
.file svg{width:22px;height:22px;flex:none;color:var(--sky)}
.link{background:none;border:0;color:var(--sky);font-weight:700;min-height:44px;padding:0 10px}
.err{color:light-dark(#B42318,#FF8A80);font-size:14px;margin:6px 0 0}.err:empty{display:none}
.mode{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;margin:12px 0 0;background:var(--plain);color:var(--ink)}
.mode.alum{background:var(--mark)}.mode+h1{margin-top:10px}
.doors{display:grid;gap:14px}
.door{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:20px}
.door.alum{border-color:var(--ink)}
.door h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:12px 0 4px;line-height:1.15}
.door p{margin:0 0 16px;color:var(--muted)}
.door .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--plain)}
.door.alum .ic{background:var(--mark)}.door.alum .btn{background:var(--mark);color:var(--ink);border:0}.door .ic svg{width:24px;height:24px}
details.key{padding:4px 14px}
details.key summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px;font-weight:600;color:var(--ink);font-size:15px}
details.key summary::-webkit-details-marker{display:none}
details.key summary .chev{transition:transform .15s}details.key[open] summary .chev{transform:rotate(90deg)}
details.key[open]{padding-bottom:12px}
.fit{margin:0 0 12px;font-size:14px;color:var(--soft)}.fit b{font-weight:600;color:var(--ink)}
.yr input{max-width:140px}
select{width:100%;font-size:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;min-height:50px;color:var(--ink)}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip[aria-pressed=true],.chip.on{background:var(--solid);color:var(--onsolid);border-color:var(--solid)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chip .xs{width:12px;height:12px;vertical-align:-1px;margin-left:4px}
.opt{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:16px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.opt b{display:block;font-weight:600}.opt small{display:block;color:var(--muted);font-size:14px}
.opt:has(input:checked){border-color:var(--sky);background:var(--tint)}
.info{background:var(--tint);border-radius:14px;padding:14px 16px;font-size:15px;margin:0 0 18px}
.mini{font-size:14px;color:var(--muted);margin:6px 4px}
label .hint{font-weight:400}
.need{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 0}.need:empty{display:none}
</style>
</head>

<script>
{
// App name and school. Each school gets its own YesList; this one is Xavier's.
const APP_NAME = "YesList";
const SCHOOL = "Xavier";

const AREAS = [
  {id:"AME", label:"Arts, Media & Entertainment", desc:"Create, perform or produce art, music, theatre, film, TV, video games and news."},

];

const MAJORS = [

  "Applied Physics (Pre-Engineering)","Art","Artificial Intelligence","Biology","Biochemistry",
  "Biomedical Sciences (Pre-Med)","Biological Sciences for Business","Biophysics",

  "Computer Science","Criminal Justice","Cybersecurity","Digital Innovation, Film, and Television",
  "Digital and Strategic Communication","Economics (Bachelor of Arts)","Economics (Business)",
  "Economics, Sustainability and Society","Education: P-5 Primary","Education: Middle Childhood",
  "Education: Special","Engineering","English","Entrepreneurship and Innovation","Environmental Management",
  "Environmental Science","Exercise Science","Finance","Fine Arts","Gender & Diversity Studies",
  "General Science","Genetics","Graphic Design","Health Administration","Health Science and Wellness",
  "History","International Business","International Studies","Liberal Arts (APEX only)",
  "Life Sciences for Business","Management","Marketing","Mathematics","Medical and Health Humanities",
  "Microbiology","Music","Musical Theatre","Neuroscience","Nonprofit Management","Nursing",
  "Occupational Therapy","Organizational Leadership","Pharmaceutical Science","Philosophy","Physics",
  "Political Science","Psychology","Social Work","Sociology","Spanish",
  "Speech, Language and Communicative Behavior","Sport Management","Sport Marketing","Theatre","Theology"
];

// Invented people and invented employers for a class demo. No real people, no real companies.
const ALUMNI = [
  {name:"Maya Okafor", year:2015, major:"Finance", job:"Senior Analyst, Corporate Finance", at:"Halvorsen Pike Advisors", city:"Cincinnati, OH",
   areas:["FA"], offers:["Advice", "Internship"],
   helps:["Finance","Accountancy","Economics (Business)","Economics (Bachelor of Arts)","Actuarial Science"],
   fit:["are curious about finance", "want to learn Excel"], note:"Ask me what a first-year analyst actually does all day."},
  {name:"Daniel Reyes", year:2011, major:"Accountancy", job:"Audit Manager", at:"Corbel & Wainwright CPAs", city:"Columbus, OH",

const S = {view:"welcome", search:"", major:null, areas:[], alum:null, from:null, offer:null,
           first:"", q:"", resume:null, last:null, requested:new Set(), draft:blankDraft(), joined:null};
const head = document.getElementById("head"), view = document.getElementById("view");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico = (id, cls) => `<svg class="${cls||""}" aria-hidden="true"><use href="#${id}"/></svg>`;
const first = n => n.trim().split(/\s+/)[0];
const lastName = n => n.trim().split(/\s+/).slice(-1)[0];
const byLast = (a, b) => lastName(a.name).localeCompare(lastName(b.name));
const sortOffers = offers => ORDER.filter(o => offers.includes(o));
const tags = offers => `<div class="tags">${sortOffers(offers).map(o => `<span class="tag ${TAG[o]}">${esc(o)}</span>`).join("")}</div>`;
const orList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " or " + arr[arr.length - 1];
const andList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
// Usage events for the class test. No names, questions or files are ever sent: only which step was reached.
// Does nothing until an analytics provider is connected (see README).
const T0 = Date.now();
function track(event, props = {}){
  const data = Object.assign({secs: Math.round((Date.now() - T0) / 1000)}, props);
  try { if (window.posthog && window.posthog.capture) window.posthog.capture(event, data); } catch (e) {}
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path: "event/" + event, title: event, event: true}); } catch (e) {}
}
const fileSize = b => b < 1048576 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1048576).toFixed(1)} MB`;

function matches(){
  const list = S.major
    ? ALUMNI.filter(a => a.helps.includes(S.major))
    : ALUMNI.filter(a => a.areas.some(x => S.areas.includes(x)));
  return list.slice().sort(byLast);
}
// What the alum sees about the student besides their name. Search results carry no major.
function context(){
  if (S.from === "search") return null;
  return S.major ? `${S.major} major` : `Interested in ${S.areas.map(id => AREA[id].label).join(", ")}`;
}
function valid(v){
  if (["welcome", "majors", "interests", "join"].includes(v)) return true;
  if (v === "alumni") return !!S.major || S.areas.length > 0;
  if (v === "request") return !!S.alum;
  if (v === "sent") return !!S.last;
  if (v === "preview") return needJoin().length === 0;
  if (v === "joined") return !!S.joined;
  return false;
}
function go(v, replace){
  S.view = v;
  history[replace ? "replaceState" : "pushState"]({v}, "", "#" + v);
  render(); window.scrollTo(0, 0);
}
window.addEventListener("popstate", e => {
  const v = (e.state && e.state.v) || location.hash.slice(1);
  if (valid(v)) { S.view = v; render(); }
  else go("welcome", true);
});

function header(title, sub){
  const back = S.view === "welcome" ? "<span></span>"
    : `<button class="back" data-act="back">${ico("left")}Back</button>`;
  const mode = STUDENT_VIEWS.includes(S.view) ? `<span class="mode">For students</span>`
    : ALUM_VIEWS.includes(S.view) ? `<span class="mode alum">For alumni</span>` : "";
  head.innerHTML = `<div class="bar">${back}<div class="brand">${ico("hand")}<span class="mk">${esc(APP_NAME)}</span><span class="school">at ${esc(SCHOOL)}</span></div></div>
    ${mode}<h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}`;
}

function card(a, from){
  const done = S.requested.has(a.name);
  const fit = (a.fit || []).filter(Boolean);
  const action = from === "preview"
    ? `<p class="mini" style="margin:0">Students tap Request here to send you their questions.</p>`
    : `<button class="btn req" data-act="request" data-from="${from}" data-v="${esc(a.name)}" ${done ? "disabled" : ""}>${done ? "Request sent" : "Request"}</button>`;
  return `<article class="card"><h2><span class="mk">${esc(a.name)}</span></h2>
    <p class="meta">Class of ${a.year} · ${esc(a.major)}</p>
    <p class="job">${esc(a.job)} at ${esc(a.at)}</p>
    ${a.field ? `<p class="meta" style="margin:2px 0 0">Field: ${esc(a.field)}</p>` : ""}
    <p class="city">${ico("pin")}${esc(a.city)}</p>
    <p class="note">“${esc(a.note)}”</p>
    ${fit.length ? `<p class="fit"><b>Good fit if you</b> ${esc(orList(fit))}.</p>` : ""}
    ${tags(a.offers)}
    ${action}
  </article>`;
}

const majorRow = m => `<button class="row" data-act="major" data-v="${esc(m)}"><span>${esc(m)}</span>${ico("chev","chev")}</button>`;
const undecidedRow = `<button class="undecided" data-act="undecided"><div><b>Undecided</b><span>Pick your interests instead</span></div>${ico("chev","chev")}</button>`;

function majorsView(){
  header("Pick your major", "Or search for a major, an alum, a company or a job.");
  view.innerHTML = `<div class="searchbar" role="search"><label for="sq" class="sr">Search majors and alumni</label>
      <div class="sbox">${ico("search","sico")}
        <input type="search" id="sq" placeholder="Search majors, alumni, companies, jobs" value="${esc(S.search)}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="clear" data-act="clear" aria-label="Clear search">${ico("x")}</button></div></div>
    <div id="res" aria-live="polite"></div>`;
  const sq = $("sq");
  sq.addEventListener("input", () => { S.search = sq.value; drawResults(); });
  sq.addEventListener("keydown", e => { if (e.key === "Enter") sq.blur(); });
  drawResults();
}
function drawResults(){
  const res = $("res"), q = S.search.trim().toLowerCase();
  document.querySelector(".clear").hidden = !q;
  if (!q){
    const groups = {};
    MAJORS.forEach(m => { const k = /[A-Z]/i.test(m[0]) ? m[0].toUpperCase() : "#"; (groups[k] = groups[k] || []).push(m); });
    res.innerHTML = undecidedRow + Object.entries(groups).map(([k, ms]) =>
      `<div class="letter" aria-hidden="true">${k}</div><div class="list">${ms.map(majorRow).join("")}</div>`).join("");
    return;
  }
  const toks = q.split(/\s+/);
  const hit = text => { const h = text.toLowerCase(); return toks.every(t => h.includes(t)); };
  const ms = MAJORS.filter(hit);
  const as = ALUMNI.filter(a => hit([a.name, a.major, a.job, a.at, a.city, a.field || "", ...a.offers, ...(a.fit || []),
    ...a.areas.map(id => AREA[id].label)].join(" "))).sort(byLast);
  const und = hit("undecided interests");
  if (!ms.length && !as.length && !und){
    res.innerHTML = `<div class="empty">Nothing matches “${esc(S.search.trim())}”. Try a major, a company, a job like “analyst”, a city, or “internship”.</div>`;
    return;
  }
  const count = [ms.length && plural(ms.length, "major", "majors"), as.length && plural(as.length, "alum", "alumni")].filter(Boolean).join(" and ");
  res.innerHTML = (count ? `<p class="rcount">${count} match</p>` : "")
    + (und ? `<div style="margin-top:12px">${undecidedRow}</div>` : "")
    + (ms.length ? `<div class="letter">Majors</div><div class="list">${ms.map(majorRow).join("")}</div>` : "")
    + (as.length ? `<div class="letter">Alumni</div>${demoLine}<div class="cards">${as.map(a => card(a, "search")).join("")}</div>` : "");
}

function interestsView(){
  header("Pick your interests", "Choose one or more. You'll see alumni who work in those areas.");
  const n = S.areas.length;
  view.innerHTML = `<div class="areas">${AREAS.map(a => `<button class="area" data-act="area" data-v="${a.id}" aria-pressed="${S.areas.includes(a.id)}">
      <span class="box">${ico("check")}</span><div><b>${esc(a.label)}</b><span>${esc(a.desc)}</span></div></button>`).join("")}</div>
    <div class="dock"><button class="btn" data-act="show" ${n ? "" : "disabled"}>Show alumni</button>
    <small>${n ? `${n} selected` : "Pick at least one"}</small></div>`;
}

// When a major has fewer than this many alumni, also show alumni in related fields.
const FEW = 3;
function related(major, exclude){
  const areas = MAJOR_AREAS[major] || [];
  const score = a => a.areas.filter(x => areas.includes(x)).length * 2 + (a.areas.includes(areas[0]) ? 1 : 0);
  return ALUMNI.filter(a => !exclude.includes(a) && a.areas.some(x => areas.includes(x)))
    .sort((a, b) => score(b) - score(a) || byLast(a, b));
}
function alumniView(){
  const list = matches();
  let sub, more = [], areaNames = [];
  if (S.major){
    sub = list.length
      ? `${plural(list.length, "alum", "alumni")} said yes to helping ${S.major} students.`
      : `No ${S.major} alumni have raised their hand yet.`;
    if (list.length < FEW){
      areaNames = (MAJOR_AREAS[S.major] || []).map(id => AREA[id].label);
      more = related(S.major, list);
    }
  } else {
    sub = `${plural(list.length, "alum", "alumni")} ${list.length === 1 ? "works" : "work"} in ${orList(S.areas.map(id => AREA[id].label))}.`;
  }
  header(S.major || "Your interests", sub);
  const shown = more.slice(0, 6);
  const moreBlock = more.length ? `
    <h2 class="sec">${list.length ? "More alumni in related fields" : "Alumni in related fields"}</h2>
    <p class="secp">These alumni work in ${esc(orList(areaNames))}, where ${esc(S.major)} graduates often work. They've said yes to helping Xavier students in other majors.${
      more.length > shown.length ? ` Showing ${shown.length} of ${more.length}.` : ""}</p>
    <div class="cards">${shown.map(a => card(a, "list")).join("")}</div>` : "";
  const empty = !list.length && !more.length
    ? `<div class="empty">No alumni match yet. Go back and pick another option.</div>` : "";
  view.innerHTML = `${offerKey()}${demoLine}
    ${list.length ? `<div class="cards">${list.map(a => card(a, "list")).join("")}</div>` : ""}
    ${moreBlock}${empty}`;
}

function missing(){
  const m = [];
  if (!S.offer) m.push("what you're asking about");
  if (!S.first.trim()) m.push("your first name");
  if (!S.q.trim()) m.push("your questions");
  if (RESUME_FOR.includes(S.offer) && !S.resume) m.push("your résumé");
  return m;
}
function updateSend(){
  const m = missing(), send = $("send"); if (!send) return;
  send.disabled = m.length > 0;
  $("need").textContent = m.length ? `Still needed: ${m.join(", ")}.` : "";
}
function drawResume(err){
  const rz = $("rz"); if (!rz) return;
  if (!RESUME_FOR.includes(S.offer)){ rz.innerHTML = ""; return; }
  const why = "internship requests";
  rz.innerHTML = `<div class="field"><span class="lbl">Your résumé<span class="hint">Required for ${why}. PDF or Word, up to ${MAX_MB} MB.</span></span>
    ${S.resume
      ? `<div class="file">${ico("doc")}<div><b>${esc(S.resume.name)}</b><span>${fileSize(S.resume.size)}</span></div>
         <button type="button" class="link" data-act="rmres">Remove</button></div>`
      : `<label class="btn ghost upl" for="rf">${ico("up")}Add résumé</label>
         <input type="file" id="rf" class="sr" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">`}
    <p class="err" role="alert">${err ? esc(err) : ""}</p></div>`;
  const rf = $("rf");
  if (rf) rf.addEventListener("change", () => {
    const f = rf.files && rf.files[0]; if (!f) return;
    if (!/\.(pdf|docx?)$/i.test(f.name)) return drawResume("That file isn't a PDF or Word document. Pick a .pdf, .doc or .docx file.");
    if (f.size > MAX_MB * 1048576) return drawResume(`That file is ${fileSize(f.size)}. Pick one under ${MAX_MB} MB.`);
    S.resume = {name: f.name, size: f.size};
    drawResume(); updateSend();
  });
}

function requestView(){
  const a = S.alum, offers = sortOffers(a.offers), one = offers.length === 1;
  if (one) S.offer = offers[0];
  const ctx = context();
  header(`Send ${first(a.name)} a request`, `Write the questions you want to ask. ${first(a.name)} sees them up front.`);
  view.innerHTML = `<div class="who"><h2>${esc(a.name)}</h2><p>${esc(a.job)} at ${esc(a.at)} · ${esc(a.city)}</p>${tags(offers)}</div>
    <form id="f" novalidate>
      <div class="field"><span class="lbl" id="ol">What are you asking about?${one ? "" : '<span class="hint">Pick one.</span>'}</span>
        <div class="chips" role="radiogroup" aria-labelledby="ol">${offers.map(o =>
          `<button type="button" class="chip" role="radio" data-act="offer" data-v="${esc(o)}" aria-checked="${S.offer === o}">${esc(o)}</button>`).join("")}</div></div>
      <div class="field"><label for="fn">Your first name</label>
        <input type="text" id="fn" maxlength="40" autocomplete="given-name" value="${esc(S.first)}"></div>
      <div class="field"><label for="qs">Your questions for ${esc(first(a.name))}</label>
        <textarea id="qs" maxlength="500" placeholder="Example: How did you land your first internship? What should I learn before I apply? Could we set up a 15-minute call?">${esc(S.q)}</textarea>
        <div class="count" id="qc">${S.q.length} / 500</div></div>
      <div id="rz"></div>
      ${ctx ? `<p class="ctx">${esc(first(a.name))} will also see: ${esc(ctx)}.</p>` : ""}
      <button class="btn" id="send" type="submit">Send request</button>
      <p class="need" id="need"></p>
    </form>`;
  const fn = $("fn"), qs = $("qs");
  const sync = () => { S.first = fn.value; S.q = qs.value; $("qc").textContent = `${S.q.length} / 500`; updateSend(); };
  fn.addEventListener("input", sync); qs.addEventListener("input", sync);
  drawResume(); updateSend();
  $("f").addEventListener("submit", e => { e.preventDefault(); if (missing().length) return;
    S.last = {alum:a, offer:S.offer, first:S.first.trim(), q:S.q.trim(), ctx,
              resume: RESUME_FOR.includes(S.offer) ? S.resume : null};
    S.requested.add(a.name); track("send_request", {offer: S.offer, from: S.from, resume: !!S.last.resume}); S.q = ""; S.offer = null;
    go("sent", true); });
}

const tick = `<div class="done"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="ring" cx="38" cy="38" r="34" fill="none" stroke-width="4"/>
  <path class="tick" d="M24 39l9 9 19-20" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
function sentView(){
  const L = S.last;
  header(`Request sent to ${L.alum.name}`, `Here's a copy of what ${first(L.alum.name)} sees.`);
  view.innerHTML = `${tick}
    <div class="copy"><dl><dt>To</dt><dd>${esc(L.alum.name)}, ${esc(L.alum.job)} at ${esc(L.alum.at)}</dd>
      <dt>From</dt><dd>${esc(L.first)}</dd><dt>Asking about</dt><dd>${esc(L.offer)}</dd>
      ${L.ctx ? `<dt>Also sent</dt><dd>${esc(L.ctx)}</dd>` : ""}
      ${L.resume ? `<dt>Résumé</dt><dd>${esc(L.resume.name)}</dd>` : ""}</dl>
      <p class="q">${esc(L.q)}</p></div>
    <p class="demo">Class demo: nothing was actually sent${L.resume ? ", and your résumé never left this phone" : ""}.</p>
    <div class="stack"><button class="btn" data-act="toalumni">${L.ctx ? "Back to alumni" : "Back to search"}</button>
      <button class="btn ghost" data-act="restart">Start over</button></div>`;
}

/* ---------- Alumni side: raise your hand ---------- */
function needJoin(){
  const d = S.draft, m = [], y = Number(d.year);
  if (!d.name.trim()) m.push("your name");
  if (!/^\d{4}$/.test(d.year.trim()) || y < 1950 || y > THIS_YEAR) m.push("a class year like 2016");
  if (!d.major.trim()) m.push("the major you graduated with");
  if (!d.job.trim()) m.push("your job title");
  if (!d.at.trim()) m.push("your employer");
  if (!d.city.trim()) m.push("your city");
  if (!d.areas.length && !d.other) m.push("the kind of work you do");
  if (d.other && !d.otherText.trim()) m.push("your field (or untick Other)");
  if (!d.helps.length) m.push("at least one major you'll help");
  if (!d.offers.length) m.push("at least one thing you can offer");
  if (!d.note.trim()) m.push("a line for students");
  return m;
}
function draftAlum(){
  const d = S.draft;
  return {name:d.name.trim().replace(/\s+/g, " "), year:Number(d.year), major:canonMajor(d.major) || d.major.trim(), job:d.job.trim(), at:d.at.trim(), city:d.city.trim(),
          areas:d.areas.slice(), field:d.other ? d.otherText.trim() : "", helps:d.helps.slice(), offers:sortOffers(d.offers),
          fit:d.fit.map(x => x.trim()).filter(Boolean), note:d.note.trim(), mine:true};
}
const txt = (id, label, val, attrs = "") => `<div class="field"><label for="${id}">${label}</label>
  <input type="text" id="${id}" value="${esc(val)}" ${attrs}></div>`;

function joinView(){
  const d = S.draft;
  header("Raise your hand", "Tell Xavier students who you'll help and what you can give. They see your card and send you their questions.");
  view.innerHTML = `<form id="jf" novalidate>
    ${txt("jn", "Your name", d.name, 'maxlength="60" autocomplete="name"')}
    <div class="field yr"><label for="jy">Class year</label>
      <input type="text" id="jy" value="${esc(d.year)}" maxlength="4" inputmode="numeric" placeholder="2016"></div>
    <div class="field"><label for="jm">Major you graduated with<span class="hint">Start typing and pick it from the list.</span></label>
      <input type="text" id="jm" value="${esc(d.major)}" maxlength="80" autocomplete="off" placeholder="Like Finance or Nursing" aria-describedby="jmr" aria-autocomplete="list">
      <div id="jmr"></div></div>
    ${txt("jt", "Job title", d.job, 'maxlength="60" placeholder="Senior Analyst"')}
    ${txt("je", "Employer", d.at, 'maxlength="60"')}
    ${txt("jc", "City", d.city, 'maxlength="40" placeholder="Cincinnati, OH"')}
    <div class="field"><span class="lbl">What kind of work do you do?<span class="hint">Pick up to 3. Undecided students find you this way. Not listed? Tap Other and type it.</span></span>
      <div class="chipset" id="ja"></div><div id="jow"></div></div>
    <div class="field"><span class="lbl">Which majors will you help?<span class="hint">Any majors, not only your own. Students in these majors see your card.</span></span>
      <div class="chipset" id="jhs"></div>
      <input type="text" id="jhq" placeholder="Add a major" autocomplete="off" value="${esc(d.hq)}">
      <div id="jhr"></div></div>
    <div class="field"><span class="lbl">What can you offer?<span class="hint">Pick any. Students ask for one at a time.</span></span>
      ${OFFERS.map(x => `<label class="opt"><input type="checkbox" data-offer="${esc(x.o)}" ${d.offers.includes(x.o) ? "checked" : ""}>
        <span><b>${esc(x.o)}</b><small>${x.d}</small></span></label>`).join("")}</div>
    <div class="field"><span class="lbl">Good fit if you…<span class="hint">Optional. Up to 3 short phrases about interests, not grades or class year.</span></span>
      ${[0,1,2].map(i => `<input type="text" class="fitin" data-i="${i}" maxlength="40" value="${esc(d.fit[i])}" placeholder="${["are curious about finance","want to learn Excel","love sports"][i]}" aria-label="Good fit phrase ${i + 1}" style="margin-bottom:8px">`).join("")}</div>
    <div class="field"><label for="jo">One line for students<span class="hint">What they can ask you about, in your own words.</span></label>
      <input type="text" id="jo" maxlength="90" value="${esc(d.note)}" placeholder="Ask me how I got from Xavier to my first job."></div>
    <p class="info"><b>Open to every year.</b> YesList doesn't let alumni pick which class years can ask. Freshmen through seniors all see your card.</p>
    <button class="btn" id="jp" type="submit">Preview my card</button>
    <p class="need" id="jneed"></p>
  </form>`;
  const bind = (id, key) => $(id).addEventListener("input", e => { S.draft[key] = e.target.value; updateJoin(); });
  bind("jn", "name"); bind("jy", "year"); bind("jt", "job"); bind("je", "at"); bind("jc", "city"); bind("jo", "note");
  $("jm").addEventListener("input", e => { d.major = e.target.value; drawMajor(); updateJoin(); });
  $("jm").addEventListener("change", () => { const m = canonMajor(d.major); if (m){ pickMajor(m); } });
  $("jhq").addEventListener("input", e => { d.hq = e.target.value; drawHelps(); });
  view.querySelectorAll("[data-offer]").forEach(c => c.addEventListener("change", () => {
    d.offers = [...view.querySelectorAll("[data-offer]:checked")].map(x => x.dataset.offer); updateJoin(); }));
  view.querySelectorAll(".fitin").forEach(c => c.addEventListener("input", () => { d.fit[+c.dataset.i] = c.value; }));
  $("jf").addEventListener("submit", e => { e.preventDefault(); if (!needJoin().length){ track("alum_preview", {majors: S.draft.helps.length, offers: S.draft.offers.join(",")}); go("preview"); } });
  drawAreas(); drawHelps(); updateJoin();
}
// Major they graduated with: type, then pick from matches. A major not on today's list is kept as typed.
const canonMajor = t => MAJORS.find(m => m.toLowerCase() === t.trim().toLowerCase()) || null;
function pickMajor(m){
  const d = S.draft; d.major = m; $("jm").value = m;
  if (!d.helps.includes(m)) d.helps.unshift(m);
  $("jmr").innerHTML = ""; drawHelps(); updateJoin();
}
function drawMajor(){
  const d = S.draft, q = d.major.trim().toLowerCase(), box = $("jmr");
  if (!q || canonMajor(d.major)){ box.innerHTML = ""; return; }
  const list = MAJORS.filter(m => m.toLowerCase().includes(q)).slice(0, 6);
  box.innerHTML = (list.length ? `<div class="list" style="margin-top:6px">${list.map(m =>
      `<button type="button" class="row" data-act="pickmajor" data-v="${esc(m)}"><span>${esc(m)}</span>${ico("chev","chev")}</button>`).join("")}</div>` : "")
    + `<p class="mini">${list.length ? "Not listed? " : ""}Majors change over time. If yours isn't on today's list, keep what you typed and your card will show it.</p>`;
}
function drawAreas(){
  const d = S.draft, full = d.areas.length + (d.other ? 1 : 0) >= 3;
  $("ja").innerHTML = AREAS.map(a => `<button type="button" class="chip" data-act="jarea" data-v="${a.id}" aria-pressed="${d.areas.includes(a.id)}"
    ${!d.areas.includes(a.id) && full ? "disabled" : ""}>${esc(a.label)}</button>`).join("")
    + `<button type="button" class="chip" data-act="jother" aria-pressed="${d.other}" ${!d.other && full ? "disabled" : ""}>Other</button>`;
  const w = $("jow");
  if (!d.other){ w.innerHTML = ""; return; }
  if (!$("jot")){
    w.innerHTML = `<label for="jot" class="sr">Your field</label><input type="text" id="jot" maxlength="50" value="${esc(d.otherText)}" placeholder="Type your field, like real estate or aviation">`;
    $("jot").addEventListener("input", e => { d.otherText = e.target.value; updateJoin(); });
  }
}
function drawHelps(){
  const d = S.draft, q = d.hq.trim().toLowerCase();
  $("jhs").innerHTML = d.helps.length
    ? d.helps.map(m => `<button type="button" class="chip on" data-act="rmhelp" data-v="${esc(m)}" aria-label="Remove ${esc(m)}">${esc(m)} ${ico("x","xs")}</button>`).join("")
    : `<p class="mini" style="margin:0">None yet. Search below or pick from the suggestions.</p>`;
  let list, label;
  if (q){ list = MAJORS.filter(m => !d.helps.includes(m) && m.toLowerCase().includes(q)).slice(0, 8); label = list.length ? "" : "No major matches that."; }
  else { list = MAJORS.filter(m => !d.helps.includes(m) && (MAJOR_AREAS[m] || []).some(x => d.areas.includes(x))).slice(0, 6);
         label = list.length ? "Suggested from the work you picked" : (d.areas.length ? "" : "Pick the kind of work you do to see suggestions."); }
  $("jhr").innerHTML = (label ? `<p class="mini">${label}</p>` : "")
    + (list.length ? `<div class="list">${list.map(m => `<button type="button" class="row" data-act="addhelp" data-v="${esc(m)}"><span>${esc(m)}</span>${ico("plus","chev")}</button>`).join("")}</div>` : "");
}
function updateJoin(){
  const m = needJoin(), b = $("jp"); if (!b) return;
  b.disabled = m.length > 0;
  $("jneed").textContent = m.length ? `Still needed: ${m.join(", ")}.` : "";
}

function previewView(){
  const a = draftAlum(), names = a.helps;
  header("Here's your card", "This is exactly what students see.");
  view.innerHTML = `<div class="cards">${card(a, "preview")}</div>
    <p class="mini" style="margin:14px 4px">Students in ${plural(names.length, "major", "majors")} will see you: ${esc(andList(names.slice(0, 4)))}${names.length > 4 ? ` and ${names.length - 4} more` : ""}.${
      a.areas.length ? ` Undecided students who pick ${esc(orList(a.areas.map(id => AREA[id].label)))} will too.` : ""}${
      a.field ? ` Anyone can find you by searching “${esc(a.field)}”.` : ""}</p>
    <div class="stack"><button class="btn" data-act="addme">Add me to ${esc(APP_NAME)}</button>
      <button class="btn ghost" data-act="back">Edit</button></div>`;
}
function joinedView(){
  const a = S.joined;
  header("You're on the list", `Students in ${plural(a.helps.length, "major", "majors")} can now send you requests.`);
  view.innerHTML = `${tick}
    <p class="mini" style="text-align:center;margin:0 4px 18px">Class demo: you're on the list only on this phone, until the page reloads.</p>
    <div class="stack"><button class="btn" data-act="seeasstudent">See your card as a student</button>
      <button class="btn ghost" data-act="home">Back to start</button></div>`;
}

function render(){
  document.title = `${APP_NAME} at ${SCHOOL}`;
  ({welcome:welcomeView, majors:majorsView, interests:interestsView, alumni:alumniView, request:requestView, sent:sentView,
    join:joinView, preview:previewView, joined:joinedView}[S.view] || welcomeView)();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const v = t.dataset.v, d = S.draft;
  switch (t.dataset.act){
    case "back": history.back(); break;
    case "tostudents": track("door_student"); go("majors"); break;
    case "tojoin": track("door_alum"); go("join"); break;
    case "home": S.joined = null; go("welcome", true); break;
    case "clear": S.search = ""; $("sq").value = ""; drawResults(); $("sq").focus(); break;
    case "undecided": track("pick_undecided"); S.major = null; go("interests"); break;
    case "major": track("pick_major", {major: v}); S.major = v; S.areas = []; go("alumni"); break;
    case "area": S.areas = S.areas.includes(v) ? S.areas.filter(x => x !== v) : AREAS.map(a => a.id).filter(id => id === v || S.areas.includes(id));
      interestsView(); { const b = document.querySelector(`.area[data-v="${v}"]`); if (b) b.focus({preventScroll:true}); } break;
    case "show": if (S.areas.length){ track("pick_interests", {areas: S.areas.join(",")}); go("alumni"); } break;
    case "request": track("tap_request", {from: t.dataset.from}); S.alum = ALUMNI.find(a => a.name === v); S.from = t.dataset.from; S.offer = null; go("request"); break;
    case "offer": S.offer = v; document.querySelectorAll(".chip[role=radio]").forEach(c => c.setAttribute("aria-checked", c.dataset.v === v));
      drawResume(); updateSend(); break;
    case "rmres": S.resume = null; drawResume(); updateSend(); break;
    case "toalumni": history.back(); break;
    case "restart": S.major = null; S.areas = []; S.alum = null; S.last = null; S.search = ""; go("majors", true); break;
    case "pickmajor": pickMajor(v); break;
    case "jother": d.other = !d.other; if (!d.other) d.otherText = ""; drawAreas(); updateJoin();
      { const b = document.querySelector("[data-act=jother]"); if (b) b.focus({preventScroll:true}); if (d.other && $("jot")) $("jot").focus(); } break;
    case "jarea": d.areas = d.areas.includes(v) ? d.areas.filter(x => x !== v) : (d.areas.length + (d.other ? 1 : 0) < 3 ? AREAS.map(a => a.id).filter(id => id === v || d.areas.includes(id)) : d.areas);
      drawAreas(); drawHelps(); updateJoin(); { const b = document.querySelector(`[data-act=jarea][data-v="${v}"]`); if (b) b.focus({preventScroll:true}); } break;
    case "addhelp": if (!d.helps.includes(v)) d.helps.push(v); d.hq = ""; $("jhq").value = ""; drawHelps(); updateJoin(); break;
    case "rmhelp": d.helps = d.helps.filter(m => m !== v); drawHelps(); updateJoin(); break;
    case "addme": { const a = draftAlum(); const i = ALUMNI.findIndex(x => x.name === a.name);
      if (i >= 0) ALUMNI[i] = a; else ALUMNI.push(a);
      S.joined = a; S.draft = blankDraft(); track("alum_added", {majors: a.helps.length}); go("joined", true); } break;
    case "seeasstudent": S.major = S.joined.helps[0]; S.areas = []; S.search = ""; go("alumni"); break;
  }
});

// Start screen, or a deep link: #join for alumni, #students (or #majors) for students.
const start = location.hash.slice(1);
history.replaceState({v:"welcome"}, "", "#welcome");
track("open", {entry: start || "welcome"});
if (start === "join") go("join");
else if (start === "students" || start === "majors") go("majors");
else render();
}
</script>
</body>
</html>
